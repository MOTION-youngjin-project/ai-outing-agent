name: CI

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop]

jobs:
  lint-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx prisma generate
        env:
          DATABASE_URL: "mysql://user:pass@localhost:3306/db"
      - run: npm run lint
      - run: npm run build
        env:
          GEMINI_API_KEY: dummy-for-build
          DATABASE_URL: "mysql://user:pass@localhost:3306/db"
